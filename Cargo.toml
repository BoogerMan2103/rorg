[package]
name = "rorg"
version = "0.2.0"
edition = "2024"
description = "Agent-friendly CLI to query and edit org-mode files piece by piece"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
